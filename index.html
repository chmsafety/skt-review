<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKT 사옥점검 강평</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1C4A73">
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="사옥점검 강평">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* 레이아웃: 좁은 한 줄 작업대(점검자·관리자) + 전체화면 강평 무대. 상태는 색 띠와 배지로 */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#15202B; --ink-2:#48566A; --ink-3:#7B8797;
  --line:#D6DDE4; --accent:#1C4A73; --accent-soft:#E3ECF5; --accent-ink:#FFFFFF;
  --good:#1565C0; --good-soft:#E3EEFB; --bad:#C62828; --bad-soft:#FBE7E7; --crisis:#B26A00; --crisis-soft:#FBF0DE;
  --ok:#2E7D32; --shadow:0 1px 2px rgba(21,32,43,.06),0 4px 16px rgba(21,32,43,.06);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161E26; --surface-2:#1C2530; --ink:#E4EAF0; --ink-2:#AAB6C3; --ink-3:#7D8A98;
  --line:#2A3542; --accent:#7FB0DE; --accent-soft:#1D2D3E; --accent-ink:#0E141A;
  --good:#64A8F0; --good-soft:#15283D; --bad:#F06C6C; --bad-soft:#3A1C1F; --crisis:#E8A948; --crisis-soft:#35291A;
  --ok:#6FCF76; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161E26; --surface-2:#1C2530; --ink:#E4EAF0; --ink-2:#AAB6C3; --ink-3:#7D8A98;
  --line:#2A3542; --accent:#7FB0DE; --accent-soft:#1D2D3E; --accent-ink:#0E141A;
  --good:#64A8F0; --good-soft:#15283D; --bad:#F06C6C; --bad-soft:#3A1C1F; --crisis:#E8A948; --crisis-soft:#35291A;
  --ok:#6FCF76; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:16px 16px 96px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:-.01em;font-size:17px;display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand i{width:10px;height:22px;border-radius:2px;background:linear-gradient(var(--bad) 0 50%,var(--good) 50% 100%)}
.top .sp{flex:1}
.mode{font-size:12px;color:var(--crisis);background:var(--crisis-soft);padding:2px 8px;border-radius:99px}
h1{font-size:22px;margin:4px 0 2px;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:17px;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:14px}
.muted{color:var(--ink-3);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;justify-content:center;min-height:40px}
a.btn{text-decoration:none;color:inherit}
.btn:hover{border-color:var(--ink-3)}
.btn.pri,a.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn.big{min-height:56px;font-size:16px;font-weight:600;flex:1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:16px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500}
input[type=text],input[type=date],input[type=email],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 11px;min-height:40px;width:100%}
textarea{resize:vertical;min-height:64px;line-height:1.45}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap}
.p-wait{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.p-up{background:var(--accent-soft);color:var(--accent)}
.p-done{background:var(--good-soft);color:var(--good)}
.p-sent{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.g-good{background:var(--good);color:#fff}
.g-bad{background:var(--bad);color:#fff}
.g-crisis{background:var(--crisis);color:#fff}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* 회차 카드 */
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.rc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;box-shadow:var(--shadow)}
.rc:hover{border-color:var(--accent)}
.rc .t{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.rc .nm{font-weight:700;font-size:17px}
.bars{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.bars div{background:var(--surface-2);border-radius:6px;padding:5px 6px;font-size:11.5px;color:var(--ink-2);display:flex;flex-direction:column}
.bars b{font-family:var(--f-mono);font-size:14px;color:var(--ink);font-weight:500}
.empty{border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--ink-2)}
/* 사진 틀 */
.box{position:relative;background:var(--surface-2);border-radius:8px;overflow:hidden;display:grid;place-items:center;aspect-ratio:4/3}
.frame{position:relative;max-width:100%;max-height:100%}
.frame img{display:block;width:100%;height:100%;object-fit:fill}
.frame svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.badge{position:absolute;left:6px;top:6px;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:5px}
.vtag{position:absolute;right:6px;bottom:6px;font-size:11px;background:rgba(0,0,0,.65);color:#fff;padding:1px 6px;border-radius:4px;font-family:var(--f-mono)}
/* 분야 */
.part{display:flex;flex-direction:column;gap:10px}
.part-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.part-h .dot{width:8px;height:8px;border-radius:99px;background:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pc.other{background:var(--surface-2)}
.pc .d{font-size:13px;line-height:1.4;min-height:2.8em;overflow-wrap:anywhere}
.pc .d b{font-weight:600}
.pc .m{font-size:11.5px;color:var(--ink-3)}
.pc .a{display:flex;gap:4px;flex-wrap:wrap}
/* 점검자 */
.who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:600;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.draft{display:grid;grid-template-columns:132px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;align-items:start}
.draft.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.draft .fields{display:flex;flex-direction:column;gap:8px;min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 14px;font-weight:600;min-height:36px}
.seg button[aria-pressed="true"].good{background:var(--good);color:#fff}
.seg button[aria-pressed="true"].bad{background:var(--bad);color:#fff}
.bulk{position:sticky;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
.chk{width:22px;height:22px;accent-color:var(--accent)}
.uptag{font-size:12px;color:var(--ink-3);font-weight:600}.uptag.ok{color:var(--ok)}.uptag.up{color:var(--accent)}.uptag.err{color:var(--bad)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--ink-2);background:var(--surface);transition:border-color .15s,background .15s}
.drop b{color:var(--ink)}
.drop.on{border-color:var(--accent);background:var(--accent-soft)}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));gap:12px}
.upwrap{max-width:720px;margin:0 auto}
@media (min-width:1000px) and (pointer:fine){.upwrap{max-width:1080px}.draft{grid-template-columns:190px 1fr}}
kbd{font-family:var(--f-mono);font-size:11.5px;border:1px solid #3A4754;border-radius:4px;padding:0 5px;background:#1A232C}
.prog{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
/* 표 */
.tbl-wrap{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 6px;text-align:left;vertical-align:middle}
table.t th{font-size:12px;color:var(--ink-3);font-weight:600}
table.t input{min-height:34px;padding:5px 8px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
/* 모달 */
.modal{position:fixed;inset:0;z-index:50;background:rgba(8,12,16,.72);display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:14px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.editor{position:fixed;inset:0;z-index:60;background:#0B0F13;color:#E8EDF2;display:flex;flex-direction:column}
.editor .bar{display:flex;gap:8px;align-items:center;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));flex-wrap:wrap}
.editor .bar .btn{background:#1A232C;border-color:#2C3945;color:#E8EDF2}
.editor .bar .btn.pri{background:#E24848;border-color:#E24848;color:#fff}
.editor .stage{flex:1;display:grid;place-items:center;min-height:0;padding:8px;touch-action:none}
.editor .cv{position:relative;touch-action:none;user-select:none;-webkit-user-select:none}
.editor .cv img{display:block;width:100%;height:100%;pointer-events:none}
.editor .cv svg{position:absolute;inset:0;width:100%;height:100%}
.editor .hint{text-align:center;font-size:13px;color:#9FB0C0;padding:8px 12px calc(12px + env(safe-area-inset-bottom,0px))}
/* 강평 무대: 발표용 단일 어두운 화면 */
.show{position:fixed;inset:0;z-index:70;background:#E6E9ED;color:#15202B;overflow:hidden;user-select:none}
.show .st{position:absolute;inset:0;display:grid;place-items:center;padding:60px 24px 118px}
.show .ph{position:relative}
.show .ph img{display:block;width:100%;height:100%}
.show .ph svg{position:absolute;inset:0;width:100%;height:100%}
.show .ph .gb{left:14px;top:14px;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.show .gb.g-fix{background:#F47920;color:#fff}
.show .gb{position:absolute;left:24px;top:20px;font-size:26px;font-weight:700;padding:4px 18px;border-radius:8px;letter-spacing:.02em}
.show .cap{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;max-width:min(1100px,92vw);text-align:center;font-size:clamp(18px,2.4vw,30px);font-weight:600;line-height:1.35;background:rgba(255,255,255,.94);color:#15202B;box-shadow:0 2px 12px rgba(21,32,43,.12);padding:10px 22px;border-radius:10px;text-wrap:balance}
.show .cap small{display:block;font-size:.62em;font-weight:500;color:#48566A}
.show .meta{position:absolute;right:20px;top:18px;font-size:14px;color:#48566A;z-index:2;display:flex;gap:12px;align-items:center}
.show .meta .btn{background:rgba(21,32,43,.06);border-color:rgba(21,32,43,.18);color:#15202B;min-height:34px;padding:4px 12px;font-size:13px}
.show .cover{text-align:center;display:flex;flex-direction:column;align-items:center;gap:clamp(14px,2.4vh,28px)}
.show .cover .mk{width:clamp(56px,7vw,96px);height:8px;border-radius:4px;background:linear-gradient(90deg,#E6022D 0 50%,#F47920 50% 100%)}
.show .cover .k{font-size:clamp(22px,3.4vw,46px);font-weight:600;letter-spacing:.08em;color:#48566A}
.show .cover h2{margin:0;font-size:clamp(52px,10vw,140px);font-weight:700;letter-spacing:-.02em;line-height:1.05;color:#15202B;text-wrap:balance}
.show.light{background:#E6E9ED;color:#15202B}
.show.light .cover .k{color:#48566A}
.show.light .cover h2{color:#15202B}
.show .cover .dt{font-size:clamp(20px,2.8vw,38px);font-weight:500;color:#48566A;letter-spacing:.02em}
.show.light .meta{color:#48566A}
.show.light .meta .btn{background:rgba(21,32,43,.06);border-color:rgba(21,32,43,.18);color:#15202B}
.show .div{text-align:center;display:flex;flex-direction:column;gap:18px;align-items:center;position:relative;z-index:1}
.show .art{position:absolute;inset:0;pointer-events:none;background:#E6E9ED center/cover no-repeat}
.show .art::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(230,233,237,.9) 0,rgba(230,233,237,.82) 35%,rgba(230,233,237,.42) 100%)}
.show .div h3{text-shadow:0 0 24px rgba(255,255,255,.9)}
.show .div .n{font-family:var(--f-mono);color:#7F93A6;font-size:22px}
.show .div h3{font-size:clamp(40px,7vw,88px);margin:0;letter-spacing:-.03em}
.show .div .c{display:flex;gap:14px;font-size:22px}
.show .div .c span{padding:6px 18px;border-radius:8px}
.show .g4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;width:100%;height:100%}
.show .st.gst{padding:56px 12px 12px}
.show .g4.n1{grid-template-columns:1fr;grid-template-rows:1fr}.show .g4.n2{grid-template-rows:1fr}.show .g4.n1 .cell{place-items:center!important}.show .g4.n2 .cell{align-items:center!important}
.show .g4 .cell:nth-child(odd){justify-items:end}.show .g4 .cell:nth-child(even){justify-items:start}.show .g4 .cell:nth-child(-n+2){align-items:end}.show .g4 .cell:nth-child(n+3){align-items:start}
.show .g4 .cell{position:relative;display:grid;place-items:center;min-height:0;min-width:0;background:transparent;overflow:hidden}
.show .g4 .cell .ph{max-width:100%;max-height:100%}
.show .g4 .cell .cc{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:clamp(13px,1.4vw,18px);padding:6px 10px;text-align:center}
.show video{max-width:100%;max-height:100%;background:#000;border-radius:6px}
.show .nav{position:absolute;top:0;bottom:0;width:22%;border:0;background:transparent}
.show .nav.l{left:0}.show .nav.r{right:0}
#netbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:95;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,transparent,var(--accent),transparent);background-size:40% 100%;background-repeat:no-repeat}
#netbar.on{opacity:1;animation:nb 1.1s linear infinite}
@keyframes nb{from{background-position:-40% 0}to{background-position:140% 0}}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:90;font-size:14px;max-width:92vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.linkbox{display:flex;gap:8px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:6px 6px 6px 12px;min-width:0}
.linkbox code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--f-mono);font-size:12.5px}
#qr img,#qr canvas{width:132px;height:132px;background:#fff;padding:6px;border-radius:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--ink-3)}.kv dd{margin:0}
@media (max-width:560px){
  h1{font-size:19px}
  .draft{grid-template-columns:96px 1fr}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bars{grid-template-columns:repeat(5,minmax(0,1fr))}
  .show .gb{font-size:18px;left:12px;top:12px}
  .show .st{padding:48px 8px 96px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="netbar" aria-hidden="true"></div>
<header class="top"><div class="top-in">
  <a class="brand" href="#" id="brand"><i></i><span>SKT 사옥점검 강평</span></a>
  <span class="mode" id="modeTag" title="서버 연결 전 시안입니다. 이 기기 브라우저에만 저장됩니다." hidden>시안 · 이 기기에만 저장</span>
  <span class="sp"></span>
  <button class="btn sm" id="installBtn" hidden>앱 설치</button>
  <nav class="row" id="topNav"></nav>
</div></header>
<main class="wrap" id="app"></main>
<div id="layer"></div>
<input type="file" id="inCam" accept="image/*" capture="environment" hidden>
<input type="file" id="inPick" accept="image/*" multiple hidden>
<input type="file" id="inVid" accept="video/*" multiple hidden>

<script>
'use strict';
/* ================= 기본 설정 ================= */
const VERSION='2단계 · 서버 연결 · 2026-09-29';
const SERVER_URL='https://script.google.com/macros/s/AKfycbw4EQym3GTqp6tNI8trfU9mwl3UlAk43HYuixK0-oq8pIHnDrZk78nCS0kHWo2RSA3W/exec';                 // Apps Script 웹앱 주소(비어 있으면 이 기기 저장 시안)
const SERVER=/^https?:\/\//.test(SERVER_URL);
const PARTS=[
  {k:'env',n:'환경',sheet:1},{k:'mech',n:'기계설비',sheet:2},{k:'fire',n:'소방',sheet:3},
  {k:'safe',n:'안전',sheet:4},{k:'crisis',n:'위기대응',sheet:0}];
const PART=Object.fromEntries(PARTS.map(p=>[p.k,p]));
const GRADE={good:'우수',bad:'미흡',crisis:'위기대응'};

const IDB={
  db:null,
  open(){return this.db?Promise.resolve(this.db):new Promise((ok,no)=>{
    const r=indexedDB.open('skt-review',1);
    r.onupgradeneeded=()=>{const d=r.result;
      d.createObjectStore('kv');d.createObjectStore('rounds',{keyPath:'id'});
      const p=d.createObjectStore('photos',{keyPath:'id'});p.createIndex('round','roundId');
      d.createObjectStore('blobs');};
    r.onsuccess=()=>{this.db=r.result;ok(this.db)};r.onerror=()=>no(r.error)})},
  async run(store,mode,fn){const d=await this.open();return new Promise((ok,no)=>{const tx=d.transaction(store,mode);const s=tx.objectStore(store);const req=fn(s);tx.oncomplete=()=>ok(req&&req.result);tx.onerror=()=>no(tx.error);tx.onabort=()=>no(tx.error)})},
  get(s,k){return this.run(s,'readonly',st=>st.get(k))},
  all(s){return this.run(s,'readonly',st=>st.getAll())},
  put(s,v,k){return this.run(s,'readwrite',st=>k===undefined?st.put(v):st.put(v,k))},
  del(s,k){return this.run(s,'readwrite',st=>st.delete(k))},
  byIndex(s,i,v){return this.run(s,'readonly',st=>st.index(i).getAll(v))}
};

/** spec: {키: 받아오는 함수}. 저장본이 다 있으면 즉시 render(저장본), 새 값이 다르면 render(새 값) 한 번 더 */
async function swr(spec,render,opt={}){
  const nav=NAVID;const ks=Object.keys(spec);const cached={};let have=SERVER;
  for(const k of ks){const v=cGet(k);if(v==null)have=false;cached[k]=v}
  if(have){try{await render(cached,true)}catch(e){console.warn('저장본 표시 실패 — 서버에서 새로 받음',e);ks.forEach(k=>cSet(k,null));have=false}}
  let fresh;
  try{const vals=await Promise.all(ks.map(k=>spec[k]()));if(BUSY&&have)return;fresh={};ks.forEach((k,i)=>{fresh[k]=vals[i];cSet(k,vals[i])})}
  catch(e){if(!have)throw e;console.warn(e);if(!e.relogin)toast('최신 내용을 불러오지 못해 저장된 내용을 보여 드립니다.');else route();return}
  if(nav!==NAVID)return;
  if(have&&JSON.stringify(fresh)===JSON.stringify(cached))return;
  if(have&&(opt.noRerender||(opt.skip&&opt.skip())||BUSY||$('.modal',layer)||$('.modal')||$('.editor')))return;
  await render(fresh,false);
}
function patchList(k,item,remove){const l=cGet(k);if(!Array.isArray(l))return;const i=l.findIndex(x=>x.id===item.id);if(remove){if(i>=0)l.splice(i,1)}else if(i>=0)l[i]={...l[i],...item};else l.push(item);cSet(k,l)}

/* ================= 사진 처리 ================= */
async function loadBitmap(blob){
  try{return await createImageBitmap(blob,{imageOrientation:'from-image'})}catch(e){}
  return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=URL.createObjectURL(blob)});
}
function canvasBlob(c,type='image/jpeg',q=.85){return new Promise(ok=>c.toBlob(ok,type,q))}
/* 회전: rot 는 시계 방향 0·90·180·270 */
async function rotateBlob(blob,rot,q=.9){const bm=await loadBitmap(blob);const w=bm.width,h=bm.height;const c=document.createElement('canvas');
  const sw=rot%180?h:w,sh=rot%180?w:h;c.width=sw;c.height=sh;const g=c.getContext('2d');g.translate(sw/2,sh/2);g.rotate(rot*Math.PI/180);g.drawImage(bm,-w/2,-h/2);
  return {blob:await canvasBlob(c,'image/jpeg',q),w:sw,h:sh}}
function rotateCircles(cs,rot){return (cs||[]).map(c=>{let {cx,cy,rx,ry}=c;for(let k=0;k<(rot/90)%4;k++){[cx,cy]=[1-cy,cx];[rx,ry]=[ry,rx]}return {cx:+cx.toFixed(4),cy:+cy.toFixed(4),rx:+rx.toFixed(4),ry:+ry.toFixed(4)}})}
async function shrink(blob,max,q=.85){const bm=await loadBitmap(blob);const w0=bm.width,h0=bm.height;const k=Math.min(1,max/Math.max(w0,h0));
  const c=document.createElement('canvas');c.width=Math.round(w0*k);c.height=Math.round(h0*k);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  return {blob:await canvasBlob(c,'image/jpeg',q),w:c.width,h:c.height}}
async function videoInfo(file){return new Promise(ok=>{const v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';
  const u=URL.createObjectURL(file);v.src=u;let done=false;
  const fin=async()=>{if(done)return;done=true;const c=document.createElement('canvas');const w=v.videoWidth||640,h=v.videoHeight||360;const k=Math.min(1,480/Math.max(w,h));
    c.width=Math.round(w*k);c.height=Math.round(h*k);try{c.getContext('2d').drawImage(v,0,0,c.width,c.height)}catch(e){}
    const thumb=await canvasBlob(c,'image/jpeg',.8);URL.revokeObjectURL(u);ok({dur:isFinite(v.duration)?v.duration:0,w,h,thumb,tw:c.width,th:c.height})};
  v.onloadeddata=()=>{try{v.currentTime=Math.min(.3,(v.duration||1)/2)}catch(e){fin()}};v.onseeked=fin;v.onerror=()=>fin();setTimeout(fin,6000)})}

/* 원: cx,cy(가로·세로 비율), rx(가로폭 비율), ry(세로높이 비율) */
function ellipses(circles,w,h,sw){return (circles||[]).map(c=>`<ellipse cx="${c.cx*w}" cy="${c.cy*h}" rx="${c.rx*w}" ry="${c.ry*h}" fill="none" stroke="#FF2A2A" stroke-width="${sw}"/>`).join('')}
function frameHTML(p,url,boxRatio=4/3,extra=''){
  const w=p.tw||p.w||4,h=p.th||p.h||3;const r=w/h;
  const size=r>=boxRatio?'width:100%':'height:100%';
  const sw=Math.max(2,w*.009);
  return `<div class="frame" style="aspect-ratio:${w}/${h};${size}"><img src="${url}" alt="" loading="lazy"><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">${p.kind==='video'?'':ellipses(p.circles,w,h,sw)}</svg></div>${extra}`}

const ROUTES={'':viewHome,'s':viewSettings,'r':viewRound,'u':viewUpload,'v':viewShow,'login':viewLogin};
const ADMIN_ROUTES=['','s','r','v'];
async function route(){
  const [k,arg]=(location.hash.replace(/^#\/?/,'')||'').split('/');
  let fn=ROUTES[k]||viewHome;
  NAVID++;layer.innerHTML='';document.body.style.overflow='';window.scrollTo(0,0);
  $('.top').hidden=(k==='v');
  API.code=null;API.rid=null;

    if(k===''&&lsGet('skt_lastview','')==='u'&&lsGet('skt_lastcode','')){location.replace('#u/'+lsGet('skt_lastcode',''));return}
    fn=viewLogin}
  if(k==='login'||(SERVER&&auth()&&k!=='u'))lsSet('skt_lastview','a');
  try{await fn(decodeURIComponent(arg||''))}catch(e){console.error(e);
    if(e.relogin){route();return}
    app.innerHTML=`<div class="empty">화면을 여는 중 문제가 생겼습니다: ${esc(e.message)}<div style="margin-top:12px"><button class="btn" onclick="route()">다시 시도</button></div></div>`}
}

function statusOf(r,photos){
  if(r.sentAt)return {t:'발송 완료',c:'p-sent'};
  if(r.reviewedAt)return {t:'강평 완료',c:'p-done'};
  if(photos&&photos.length)return {t:'사진 등록 중',c:'p-up'};
  return {t:'준비',c:'p-wait'};
}
function countBy(photos){const o={};for(const p of PARTS)o[p.k]={good:0,bad:0,crisis:0,video:0};
  for(const x of photos){const c=o[x.part];if(!c)continue;if(x.kind==='video')c.video++;else c[x.grade]++}return o}
function ordered(list){return [...list].sort((a,b)=>(a.order??0)-(b.order??0)||(a.createdAt-b.createdAt))}
function upLink(r){return location.href.split('#')[0]+'#u/'+r.code}

      ${on?`<circle data-h="${i}" cx="${x+rx*K}" cy="${y+ry*K}" r="13" fill="#fff" stroke="#FF2A2A" stroke-width="3"/>`:''}`}).join('')};
  let drag=null;
  const pt=e=>{const b=cv.getBoundingClientRect();return {x:Math.min(Math.max(e.clientX-b.left,0),W),y:Math.min(Math.max(e.clientY-b.top,0),H)}};
  cv.addEventListener('pointerdown',e=>{e.preventDefault();const q=pt(e);const t=e.target;
    if(t.dataset&&t.dataset.h!==undefined){sel=+t.dataset.h;drag={m:'r'}}
    else if(t.dataset&&t.dataset.i!==undefined){sel=+t.dataset.i;const c=cs[sel];drag={m:'m',dx:q.x-c.cx*W,dy:q.y-c.cy*H}}

  const key=e=>{if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();$('#ceDel',ed).click()}else if(e.key==='Escape'){e.preventDefault();close()}else if(e.key==='Enter'){e.preventDefault();$('#ceOk',ed).click()}};
  addEventListener('keydown',key);
  const up=()=>{drag=null};cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  const close=()=>{removeEventListener('resize',fit);removeEventListener('keydown',key);ed.remove();document.body.style.overflow=''};
  $('#ceDel',ed).onclick=()=>{if(sel>=0){cs.splice(sel,1);sel=cs.length-1;draw()}};
  $('#ceClr',ed).onclick=()=>{cs=[];sel=-1;draw()};
  $('#ceNo',ed).onclick=close;
  $('#ceOk',ed).onclick=()=>{close();done(cs.map(c=>({cx:+c.cx.toFixed(4),cy:+c.cy.toFixed(4),rx:+c.rx.toFixed(4),ry:+c.ry.toFixed(4)})))};
  addEventListener('resize',fit);$('img',ed).complete?fit():$('img',ed).onload=fit;requestAnimationFrame(fit);
}

const PREQ={run:0,q:[]};
function startPre(d,r){if(!SERVER)return;d.pre=null;d.st='wait';setPreTag(d);
  d.pre=new Promise((ok,no)=>{PREQ.q.push({d,r,ok,no});pumpPre()});d.pre.catch(()=>{})}
function pumpPre(){while(PREQ.run<6&&PREQ.q.length){const {d,r,ok,no}=PREQ.q.shift();PREQ.run++;d.st='up';setPreTag(d);
  API.preUpload(r.id,d.file,d.thumb,(d.part+'_'+d.key)).then(x=>{d.ids=x;d.st='ok';setPreTag(d);ok(x)}).catch(e=>{d.st='err';d.err=e.message;setPreTag(d);no(e)}).finally(()=>{PREQ.run--;pumpPre()})}}
function setPreTag(d){const el=document.getElementById('st_'+d.key);if(!el)return;

/* ================= 위기대응 영상 합치기 ================= */
function allocate(durs,total){ // 영상마다 앞부분을 잘라 합계가 total 이 되도록(짧은 영상의 남는 시간은 나머지에 나눔)
  const n=durs.length;const out=new Array(n).fill(0);let left=total;let idx=durs.map((d,i)=>i);
  while(idx.length&&left>0.05){const share=left/idx.length;const next=[];
    for(const i of idx){const room=durs[i]-out[i];if(room<=share){out[i]+=room;left-=room}else next.push(i)}
    if(next.length===idx.length){for(const i of next){out[i]+=share}left=0}idx=next}
  return out.map(v=>Math.max(0,+v.toFixed(2)));
}
function bgMusic(ac,out,dur){ // 합본 영상 배경음악 「신속 대응」: 직접 합성(저작권 걱정 없음), 145BPM 4박 킥+16분 아르페지오(Am–F–C–G), 작게 깔고 앞뒤 서서히
  const VOL=.16,bpm=145,prog=[[57,60,64],[53,57,60],[48,52,55],[55,59,62]];
  const m=ac.createGain(),comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;comp.connect(m);m.connect(out);
  const t0=ac.currentTime+.05,bt=60/bpm,bar=bt*4,hz=n=>440*Math.pow(2,(n-69)/12);
  m.gain.setValueAtTime(0,t0);m.gain.linearRampToValueAtTime(VOL,t0+.4);
  const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const env=(g,t,peak,att,len)=>{g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0005,t+len);g.gain.linearRampToValueAtTime(0,t+len+.02)};
  const tone=(type,f,t,len,peak,att=.005,cut=0)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    let n=o;if(cut){const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=cut;o.connect(fl);n=fl}
    n.connect(g);g.connect(comp);env(g,t,peak,att,len);o.start(t);o.stop(t+len+.05)};
  const noise=(t,len,peak,type,f)=>{const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;fl.type=type;fl.frequency.value=f;
    s.connect(fl);fl.connect(g);g.connect(comp);env(g,t,peak,.002,len);s.start(t,Math.random()*.5);s.stop(t+len+.05)};
  const kick=t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(45,t+.12);
    o.connect(g);g.connect(comp);env(g,t,.9,.002,.28);o.start(t);o.stop(t+.35)};
  const bars=Math.ceil((dur+2)/bar);
  for(let b=0;b<bars;b++){const ch=prog[b%4],tb=t0+b*bar;
    for(let k=0;k<4;k++){kick(tb+k*bt);noise(tb+(k+.5)*bt,.045,.14,'highpass',7000);tone('sawtooth',hz(ch[0]-24),tb+(k+.5)*bt,bt*.4,.3,.004,600)}
    if(b%2===1){noise(tb+3.5*bt,.16,.45,'highpass',1500);tone('triangle',190,tb+3.5*bt,.08,.25)}
    const ar=[ch[0],ch[1],ch[2],ch[0]+12,ch[1]+12,ch[2]+12,ch[0]+12,ch[2]];
    for(let k=0;k<16;k++)tone('sawtooth',hz(ar[k%8]+12),tb+k*bt/4,bt*.22,.06,.003,3000);
    ch.forEach(n=>tone('triangle',hz(n),tb,bar,.05,.2))}
  return{m,fadeOut(){const t=ac.currentTime;m.gain.cancelScheduledValues(t);m.gain.setValueAtTime(m.gain.value,t);m.gain.linearRampToValueAtTime(0,t+.6)}};
}
async function mergeVideos(items,total,onProg){
  if(!window.MediaRecorder||!HTMLCanvasElement.prototype.captureStream)throw new Error('이 브라우저는 영상 합치기를 지원하지 않습니다. 노트북의 크롬이나 엣지에서 해 주세요.');
  onProg(0,'영상 불러오는 중…');
  const vids=[];
  for(const it of items){const b=await API.getBlob(it.fileId);const v=document.createElement('video');v.src=URL.createObjectURL(b);v.playsInline=true;v.preload='auto';v.crossOrigin='anonymous';
    await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=()=>no(new Error(`「${it.name||'영상'}」을(를) 열 수 없습니다.`))});vids.push(v)}

  const W=1280,H=720;const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  g.fillStyle='#000';g.fillRect(0,0,W,H);

    for(const v of vids){ac.createMediaElementSource(v).connect(dest)}const at=dest.stream.getAudioTracks()[0];if(at)stream.addTrack(at)}catch(e){ac=null;vids.forEach(v=>v.muted=true)}
  const types=['video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'];

  rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  const stopped=new Promise(ok=>rec.onstop=ok);

  rec.start(250);
  const sum=segs.reduce((a,b)=>a+b,0)||1;let doneT=0;
  if(ac&&dest){try{bg=bgMusic(ac,dest,sum)}catch(e){bg=null}}
  for(let i=0;i<vids.length;i++){const v=vids[i],seg=segs[i];if(seg<=0)continue;
    v.currentTime=0;await new Promise(ok=>{if(v.readyState>=2&&v.currentTime===0)ok();else{v.onseeked=ok;setTimeout(ok,1500)}});
    await v.play().catch(()=>{v.muted=true;return v.play()});
    await new Promise(ok=>{const tick=()=>{const vw=v.videoWidth||W,vh=v.videoHeight||H;const k=Math.min(W/vw,H/vh);const dw=vw*k,dh=vh*k;
        g.fillStyle='#000';g.fillRect(0,0,W,H);g.drawImage(v,(W-dw)/2,(H-dh)/2,dw,dh);
        onProg(Math.min(1,(doneT+v.currentTime)/sum),`${i+1}/${vids.length}번째 영상 · ${(doneT+v.currentTime).toFixed(1)}초 / ${sum.toFixed(1)}초`);
        if(v.currentTime>=seg||v.ended)ok();else requestAnimationFrame(tick)};tick()});
    v.pause();doneT+=seg}

  rec.stop();await stopped;if(ac)ac.close().catch(()=>{});
  vids.forEach(v=>URL.revokeObjectURL(v.src));
  onProg(1,'완료');
  return new Blob(chunks,{type:(mime||'video/webm').split(';')[0]});
}

    for(let k=0;k<3;k++){const T=slot[k];const rr=b+k;const c=T.c;
      const keep=col=>c[col]&&c[col].inner?`<c r="${col}${rr}"${c[col].s?` s="${c[col].s}"`:''}${c[col].t?` t="${c[col].t}"`:''}>${c[col].inner}</c>`:cellXml(col,rr,c[col]);
      let d='';if(it){d=k===0?it.place:k===1?it.desc:''}else if(k===1)d='지적사항 없음';
      out+=`<row r="${rr}"${T.attr}>${k===0?keep('A'):cellXml('A',rr,c.A)}${cellXml('B',rr,c.B)}${keep('C')}${cellXml('D',rr,c.D,d)}${cellXml('E',rr,c.E)}${cellXml('F',rr,c.F)}</row>`}
    merges.push(`A${b}:A${b+2}`,`B${b}:B${b+2}`,`F${b}:F${b+2}`);e1.push('E'+b);e2.push('E'+(b+1))}
  const last=3+3*n;
  xml=xml.replace(/<sheetData>.*<\/sheetData>/s,`<sheetData>${out}</sheetData>`);
  xml=xml.replace(/<dimension ref="[^"]*"\/>/,`<dimension ref="A1:F${last}"/>`);
  xml=xml.replace(/<mergeCells[^>]*>.*?<\/mergeCells>/s,`<mergeCells count="${merges.length}">${merges.map(m=>`<mergeCell ref="${m}"/>`).join('')}</mergeCells>`);
  xml=xml.replace(/(<dataValidation [^>]*?sqref=")[^"]*("[^>]*><formula1>INDIRECT)/,`$1${e2.join(' ')}$2`);
  xml=xml.replace(/(<dataValidation [^>]*?sqref=")[^"]*("[^>]*><formula1>조치현황_분류)/,`$1${e1.join(' ')}$2`);
  xml=xml.replace(/topLeftCell="[^"]*"/,'topLeftCell="A4"').replace(/<selection pane="bottomLeft"[^>]*\/>/,'<selection pane="bottomLeft" activeCell="D4" sqref="D4"/>').replace(/<selection activeCell="[^"]*" sqref="[^"]*"\/>/,'<selection activeCell="A1" sqref="A1"/>');
  return xml;
}
async function excelPhoto(p){ // 양식 칸 비율로 잘라 원을 입혀 JPEG 로
  const bm=await loadBitmap(await API.getBlob(p.fileId));const w=bm.width,h=bm.height;
  let cw=w,ch=h;if(w/h>XL_R)cw=h*XL_R;else ch=w/XL_R;
  let fx=w/2,fy=h/2;const cs=p.circles||[];
  if(cs.length){const x0=Math.min(...cs.map(c=>(c.cx-c.rx)*w)),x1=Math.max(...cs.map(c=>(c.cx+c.rx)*w)),y0=Math.min(...cs.map(c=>(c.cy-c.ry)*h)),y1=Math.max(...cs.map(c=>(c.cy+c.ry)*h));fx=(x0+x1)/2;fy=(y0+y1)/2}
  const sx=Math.min(Math.max(fx-cw/2,0),w-cw),sy=Math.min(Math.max(fy-ch/2,0),h-ch);
  const OW=720,OH=Math.round(OW/XL_R);const c=document.createElement('canvas');c.width=OW;c.height=OH;const g=c.getContext('2d');
  g.drawImage(bm,sx,sy,cw,ch,0,0,OW,OH);
  const k=OW/cw;g.strokeStyle='#FF0000';g.lineWidth=Math.max(4,OW*.008);
  for(const e of cs){g.beginPath();g.ellipse((e.cx*w-sx)*k,(e.cy*h-sy)*k,Math.max(1,e.rx*w*k),Math.max(1,e.ry*h*k),0,0,Math.PI*2);g.stroke()}
  return new Uint8Array(await (await canvasBlob(c,'image/jpeg',.86)).arrayBuffer());
}
function anchorXml(row,rid,pid){return `<xdr:oneCellAnchor><xdr:from><xdr:col>1</xdr:col><xdr:colOff>0</xdr:colOff><xdr:row>${row}</xdr:row><xdr:rowOff>0</xdr:rowOff></xdr:from><xdr:ext cx="${XL_W}" cy="${XL_H}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${pid+1}" name="현장사진 ${pid}"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr><xdr:blipFill><a:blip xmlns:r="${XLNS}" r:embed="rId${rid}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${XL_W}" cy="${XL_H}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`}
async function buildExcel(r,photos,onProg){
  if(!window.JSZip)throw new Error('엑셀 도구(JSZip)를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');
  const zip=await JSZip.loadAsync(TEMPLATE_B64,{base64:true});
  const parts=PARTS.filter(p=>p.sheet);const all=parts.map(p=>ordered(photos.filter(x=>x.part===p.k&&x.grade==='bad'&&x.kind!=='video')));
  const total=all.reduce((a,b)=>a+b.length,0)||1;let done=0,media=0;
  await Promise.all(all.flat().map(p=>API.getBlob(p.fileId)));
  for(let s=0;s<parts.length;s++){const p=parts[s],items=all[s];const path=`xl/worksheets/sheet${p.sheet}.xml`;
    zip.file(path,rebuildSheet(await zip.file(path).async('string'),items,r.siteName,r.date));
    let anchors='',rels='';
    for(let i=0;i<items.length;i++){media++;zip.file(`xl/media/image${media}.jpeg`,await excelPhoto(items[i]));
      rels+=`<Relationship Id="rId${i+1}" Type="${XLNS}/image" Target="../media/image${media}.jpeg"/>`;anchors+=anchorXml(3+3*i,i+1,i+1);done++;onProg&&onProg(done/total)}
    zip.file(`xl/drawings/drawing${p.sheet}.xml`,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">${anchors}</xdr:wsDr>`);
    if(items.length)zip.file(`xl/drawings/_rels/drawing${p.sheet}.xml.rels`,`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels}</Relationships>`)}
  return zip.generateAsync({type:'blob',compression:'DEFLATE',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
async function makeExcel(r,photos,progSel){
  const pr=$(progSel);if(pr){pr.hidden=false;pr.firstChild.style.width='0'}
  try{return await buildExcel(r,photos,f=>{if(pr)pr.firstChild.style.width=(f*100)+'%'})}
  catch(e){console.error(e);toast('엑셀을 만들지 못했습니다: '+e.message,4000);return null}
  finally{if(pr)setTimeout(()=>pr.hidden=true,600)}
}
